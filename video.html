<script>
  const blocos = document.querySelectorAll(
    '.banner1, .estudante-div, .secao-video, .secao-mapa, .secao-jogo, .escola'
  );

  const observador = new IntersectionObserver((entradas) => {
    entradas.forEach((entrada) => {
      if (entrada.isIntersecting) {
        entrada.target.style.opacity = '1';
        entrada.target.style.transform = 'translateY(0)';
      }
    });
  }, { threshold: 0.15 });

  blocos.forEach((bloco) => {
    bloco.style.opacity = '0';
    bloco.style.transform = 'translateY(50px)';
    bloco.style.transition = 'opacity 0.8s ease-out, transform 0.8s ease-out';
    observador.observe(bloco);
  });
</script>
